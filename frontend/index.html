

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificador de Dígitos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Classificador de Dígitos</h1>
        <p>Envie uma imagem para identificar o número desenhado.</p>
    </header>

    <main>
        <div class="cards-container">
            <section>
                <h2>1. Selecionar imagem</h2>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/png, image/jpeg"
                >

                <div>
                    <img
                        id="imagePreview"
                        alt="Pré-visualização da imagem selecionada"
                        hidden
                        width="200"
                    >
                </div>

                <canvas id="imageCanvas" width="28" height="28" hidden></canvas>

                <div id="preparedImageContainer" hidden>
                    <p>Imagem preparada para classificação:</p>
                    <canvas id="preparedImagePreview" width="28" height="28"></canvas>
                </div>

                <button id="classifyButton" disabled>
                    Classificar dígito
                </button>
            </section>

            <section>
                <h2>2. Resultado</h2>

                <p id="statusMessage">
                    Selecione uma imagem para começar.
                </p>

                <div id="result" hidden>
                    <p>
                        Dígito previsto:
                        <strong id="prediction">-</strong>
                    </p>

                    <h3>Probabilidades por dígito</h3>
                    <div id="probabilities"></div>
                </div>
            </section>
        </div>

        <footer class="api-health">
            <span>Status:</span>
            <span
                id="apiStatusIndicator"
                class="status-light status-offline"
                role="status"
                aria-label="API indisponível"
            ></span>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
